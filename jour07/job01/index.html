<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Document</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
        }
    </style>
</head>

<body>
    <header>

        <nav>
            <div class="nav-wrapper blue darken-2">
                <a href="#" class="brand-logo">Logo</a>
                <ul id="nav-mobile" class="right hide-on-med-and-down">
                    <li><a href="">Sass</a></li>
                    <li><a href="">Components</a></li>
                    <li><a href="">JavaScript</a></li>
                </ul>
            </div>
        </nav>

    </header>

    <main>

        <section class="container">
            <h3>Formulaire</h3>
            <form class="col s12">
                <label>
                    <input class="with-gap" name="group1" type="radio" />
                    <span>Monsieur</span>
                </label>

                <label>
                    <input class="with-gap" name="group1" type="radio" />
                    <span>Madame</span>
                </label>

                <label>
                    <input class="with-gap" name="group1" type="radio" />
                    <span>Autre</span>
                </label>

                <div class="row">
                    <div class="input-field col s6">
                        <input placeholder="Entrez votre prénom..." id="first_name" type="text" class="validate">
                        <label for="first_name">Prénom</label>
                    </div>

                    <div class="input-field col s6">
                        <input placeholder="Entrez votre nom..." id="last_name" type="text" class="validate">
                        <label for="last_name">Nom</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12">
                        <input placeholder="Entrez votre adresse..." id="address" type="text" class="validate">
                        <label for="address">Adresse</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12">
                        <input id="email" type="email" placeholder="Votre email..." class="validate">
                        <label for="email">Email</label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-field col s12">
                        <input id="password" type="password" class="validate">
                        <label for="password">Mot de passe</label>
                    </div>
                </div>

                <h4>Sélectionnez vos passions</h4>

                <div class="row">
                    <p class="col s3">
                        <label>
                            <input type="checkbox" />
                            <span>Informatique</span>
                        </label>
                    </p>
                    <p class="col s3">
                        <label>
                            <input type="checkbox" />
                            <span>Sport</span>
                        </label>
                    </p>
                    <p class="col s3">
                        <label>
                            <input type="checkbox" />
                            <span>Voyages</span>
                        </label>
                    </p>
                    <p class="col s3">
                        <label>
                            <input type="checkbox" />
                            <span>Lecture</span>
                        </label>
                    </p>
                </div>

                <button class="btn blue" type="submit">ENVOYER</button>

            </form>
        </section>
        <br>

    </main>

    <footer class="page-footer blue darken-2">
        <div class="container">
            <h5 class="white-text">Links</h5>
            <ul>
                <li><a class="grey-text text-lighten-3" href="">Accueil</a></li>
                <li><a class="grey-text text-lighten-3" href="">Inscription</a></li>
                <li><a class="grey-text text-lighten-3" href="">Connexion</a></li>
                <li><a class="grey-text text-lighten-3" href="">Rechercher</a></li>
            </ul>
        </div>
        <div class="footer-copyright">
            <div class="container">
                © 2025 Copyright Text
                <a class="grey-text text-lighten-4 right" href="">More Links</a>
            </div>
        </div>
    </footer>

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
